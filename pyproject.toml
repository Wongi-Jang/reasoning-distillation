[project]
name = "rd"
version = "0.1.0"
description = "Reasoning distillation: Qwen3-30B-A3B teacher -> Qwen3-Base students"
requires-python = ">=3.12,<3.13"
dependencies = [
    "datasets>=3.0",
    "transformers>=4.51",  # Qwen3 support
    "torch>=2.6",
    "matplotlib>=3.9",
    "math-verify>=0.7",  # symbolic answer equivalence (sympy)
]

[project.optional-dependencies]
# GPU box only (linux + CUDA). `uv sync --extra gpu`
gpu = ["vllm>=0.10; sys_platform == 'linux'"]

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/rd"]
